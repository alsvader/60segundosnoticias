name: Release

# Suite de QA extendida, manual y opcional - Firefox/WebKit sobre los 8
# journeys críticos, regresión visual, smoke real de Docker de producción
# (compose.prod.yaml) y Lighthouse. Ya no corre automáticamente en cada
# push a main (ci.yml ya cubre el gate obligatorio de PR/merge) ni publica
# nada por defecto - Dokploy construye y despliega directamente desde
# compose.dokploy.yaml vía su propio Auto Deploy nativo sobre `main`.
#
# Los jobs `publish`/`deploy`/`provenance` (modelo anterior: GitHub Actions
# construye y publica imágenes a GHCR con tag por SHA, y despliega a
# Dokploy vía API tras aprobación manual) se dejan definidos pero inactivos
# - nunca se borraron, solo quedan detrás del input `publish_and_deploy`
# para quien quiera volver puntualmente a ese modelo sin reintroducir
# código eliminado.
on:
  workflow_dispatch:
    inputs:
      publish_and_deploy:
        description: 'Publicar imágenes a GHCR y desplegar vía API a Dokploy (modelo legado - normalmente no hace falta, Dokploy ya despliega solo desde main)'
        required: false
        type: boolean
        default: false

# Dos releases de producción SHALL NOT correr en simultáneo (tarea 9.5) -
# nunca se cancela un release ya en curso, solo se encolan.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PNPM_VERSION: '10.28.2'
  NODE_VERSION: '24'
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/60segundosnoticias

jobs:
  ci-gates:
    name: ci-gates
    uses: ./.github/workflows/ci.yml

  e2e-full:
    name: e2e-full
    needs: ci-gates
    runs-on: ubuntu-latest
    # Mismos servicios desechables que el `e2e-pr` de ci.yml - nunca
    # secretos ni infraestructura de producción real (tarea 9.7).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: 60segundos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 60segundos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tarea 9.6: SHALL cachearse el store de pnpm (`cache: pnpm` arriba)
      # y los binarios de Playwright - nunca datos de Postgres/MinIO. La
      # clave SHALL incluir el conjunto exacto de navegadores instalados
      # ("firefox-webkit" aquí, distinto de "chromium" en ci.yml/`visual`)
      # - confirmado en vivo: sin este sufijo, este job compartía la
      # misma clave que `e2e-pr` (ci.yml, solo chromium), que siempre
      # termina primero dentro de `ci-gates` y guarda su cache "solo
      # chromium" bajo esa clave; este job la restauraba tal cual y los
      # tests de Firefox/WebKit fallaban con "Executable doesn't exist" a
      # pesar de correr `playwright install --with-deps firefox webkit`
      # justo después. GitHub Actions documenta explícitamente que
      # compartir una clave entre jobs con contenido distinto no es
      # seguro. Nunca reutilizar esta clave para un conjunto de
      # navegadores distinto.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps firefox webkit

      - name: Start disposable MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=e2eminioadmin \
            -e MINIO_ROOT_PASSWORD=e2eminioadmin \
            quay.io/minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO and create the disposable test bucket
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh quay.io/minio/mc:latest -c "
            mc alias set e2e http://localhost:9000 e2eminioadmin e2eminioadmin &&
            (mc mb e2e/e2e-test-media || true) &&
            mc anonymous set download e2e/e2e-test-media
          "

      # Solo los 8 journeys críticos etiquetados @smoke-cross-browser
      # (design.md, Decisión 10) - Firefox y WebKit no corren la suite
      # completa, solo este subconjunto crítico.
      - run: pnpm exec playwright test --project=firefox --project=webkit

      - name: Stop disposable MinIO
        if: always()
        run: docker rm -f minio || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-report
          path: playwright-report/
          retention-days: 14

  visual:
    name: visual
    needs: ci-gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: 60segundos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 60segundos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tarea 9.6: SHALL cachearse el store de pnpm (`cache: pnpm` arriba)
      # y los binarios de Playwright - nunca datos de Postgres/MinIO. La
      # clave SHALL incluir el conjunto exacto de navegadores instalados
      # ("chromium", igual que `e2e-pr` en ci.yml - no hay colisión porque
      # ambos jobs instalan exactamente el mismo conjunto, y `visual` solo
      # corre después de que `ci-gates` termina, nunca en paralelo con
      # `e2e-pr`). Ver el comentario equivalente en `e2e-full` arriba
      # sobre el incidente real que motivó este sufijo.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start disposable MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=e2eminioadmin \
            -e MINIO_ROOT_PASSWORD=e2eminioadmin \
            quay.io/minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO and create the disposable test bucket
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh quay.io/minio/mc:latest -c "
            mc alias set e2e http://localhost:9000 e2eminioadmin e2eminioadmin &&
            (mc mb e2e/e2e-test-media || true) &&
            mc anonymous set download e2e/e2e-test-media
          "

      # Sin --update-snapshots: compara contra las baselines *-linux.png
      # committeadas. La primera vez que este job corre no existen -
      # falla a propósito (design.md), sube las capturas "actual" como
      # artifact para revisión humana y commit deliberado, nunca
      # auto-aprobado desde CI. `--project=chromium` vive en el propio
      # script (nunca como `pnpm test:visual -- --project=chromium` en
      # este step) - ver el comentario equivalente en `e2e-pr`/`ci.yml`
      # sobre por qué `pnpm run <script> -- <flags>` reenvía el `--`
      # literal y rompe el parseo de flags de Playwright.
      - run: pnpm test:visual

      - name: Stop disposable MinIO
        if: always()
        run: docker rm -f minio || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-actual-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  docker-smoke:
    name: docker-smoke
    needs: ci-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/docker-smoke.sh reutiliza el MinIO desechable de
      # compose.test.yml (vía host.docker.internal - extra_hosts en
      # compose.prod.yaml lo hace resoluble en Docker Engine de Linux).
      - name: Start disposable MinIO (compose.test.yml)
        run: docker compose -f compose.test.yml up -d minio minio-init

      - run: bash scripts/docker-smoke.sh

      - if: always()
        run: docker compose -f compose.test.yml down --remove-orphans

  lighthouse:
    name: lighthouse
    needs: ci-gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: 60segundos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d 60segundos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start disposable MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=e2eminioadmin \
            -e MINIO_ROOT_PASSWORD=e2eminioadmin \
            quay.io/minio/minio:latest server /data --console-address ":9001"

      - name: Wait for MinIO and create the disposable test bucket
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh quay.io/minio/mc:latest -c "
            mc alias set e2e http://localhost:9000 e2eminioadmin e2eminioadmin &&
            (mc mb e2e/e2e-test-media || true) &&
            mc anonymous set download e2e/e2e-test-media
          "

      # test:e2e:server ya hace build de producción + migrate + seed -
      # lo dejamos arrancado en segundo plano para que lhci le pegue.
      - name: Build and start the production server
        run: |
          nohup pnpm test:e2e:server > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health >/dev/null; then break; fi
            sleep 5
          done

      - run: pnpm exec lhci autorun

      - if: always()
        run: cat server.log

      - name: Stop disposable MinIO
        if: always()
        run: docker rm -f minio || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30

  # Modelo legado (inactivo por defecto - ver el comentario de cabecera):
  # publica imágenes runner/migrator con tag por SHA a GHCR. Solo corre si
  # se dispara el workflow con `publish_and_deploy: true`.
  publish:
    name: publish
    needs: [e2e-full, visual, docker-smoke, lighthouse]
    if: inputs.publish_and_deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      runner-tag: ${{ steps.tags.outputs.runner }}
      migrator-tag: ${{ steps.tags.outputs.migrator }}
    steps:
      - uses: actions/checkout@v4

      - id: tags
        run: |
          echo "runner=${{ env.IMAGE_BASE }}:runner-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "migrator=${{ env.IMAGE_BASE }}:migrator-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Placeholder DATABASE_URI/PAYLOAD_SECRET solo necesitan forma
      # válida (Dockerfile, stage `builder`) - nunca un secreto real de
      # producción (tarea 9.7). El invariante de
      # openspec/changes/runtime-public-rendering (build sin Postgres
      # alcanzable) es precisamente lo que hace esto seguro.
      - name: Build and push runner
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.tags.outputs.runner }}
            ${{ env.IMAGE_BASE }}:runner-main
          build-args: |
            DATABASE_URI=postgres://release-placeholder-unreachable:5432/release-placeholder
            PAYLOAD_SECRET=release-placeholder-secret
            NEXT_PUBLIC_SITE_URL=https://60segundosnoticias.com
            GIT_SHA=${{ github.sha }}

      - name: Build and push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ steps.tags.outputs.migrator }}
            ${{ env.IMAGE_BASE }}:migrator-main

  # openspec/changes/production-deployment-dokploy - Etapas 4/5 del plan,
  # design.md Decisiones 1/3/4. Entre `publish` y `provenance` a propósito
  # (`provenance` SHALL seguir con `needs: publish`, nunca `needs: deploy`,
  # para que el registro de la corrida no quede bloqueado detrás del clic
  # de aprobación humana de este job).
  #
  # `environment: production` es lo que produce la pausa de aprobación -
  # el Environment de GitHub (prerrequisito manual del operador, plan
  # Etapa 7) tiene *required reviewers* configurados. `environment.url`
  # SHALL ser una URL literal o de `vars`, nunca de `secrets` - por eso
  # `PRODUCTION_URL` vive como variable del Environment y no como secret,
  # a diferencia de las credenciales de Dokploy.
  # Modelo legado (inactivo por defecto - ver el comentario de cabecera):
  # despliega a Dokploy vía API las imágenes que `publish` acaba de subir a
  # GHCR. Solo corre si se dispara el workflow con `publish_and_deploy:
  # true`. En el modelo actual, Dokploy despliega solo desde `main` vía su
  # Auto Deploy nativo - este job ya no es parte del camino normal.
  deploy:
    name: deploy
    needs: publish
    if: inputs.publish_and_deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Tolera falla a propósito (`|| true`): el primer despliegue real
      # nunca tuvo una release previa que responder. Este valor es solo
      # informativo para el resumen final del job - `dokploy-deploy.ts`
      # hace su propia lectura independiente para clasificar fallas.
      - name: Capturar el SHA actualmente vivo (tolera falla, p. ej. primer despliegue)
        id: previous-sha
        run: |
          sha="$(curl -sf "${{ vars.PRODUCTION_URL }}/api/health" 2>/dev/null | jq -r '.sha // empty' || true)"
          echo "sha=${sha:-desconocido}" >> "$GITHUB_OUTPUT"

      # scripts/dokploy-deploy.ts: compose.one -> reescribir env ->
      # compose.update -> re-leer y verificar byte a byte -> compose.deploy
      # -> esperar transición de estado + SHA vivo (design.md Decisión 3).
      # Los tags SHALL consumirse verbatim desde `needs.publish.outputs` -
      # nunca reconstruidos desde `IMAGE_BASE`, para que el alias mutable
      # `-main` no pueda filtrarse aquí.
      - name: Desplegar a Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          RUNNER_IMAGE: ${{ needs.publish.outputs.runner-tag }}
          MIGRATOR_IMAGE: ${{ needs.publish.outputs.migrator-tag }}
          GIT_SHA: ${{ github.sha }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/dokploy-deploy.ts

      # Señal 3 (design.md Decisión 3): corre solo si el paso anterior ya
      # confirmó las señales 1 y 2 - un smoke que pasara antes de eso
      # podría estar viendo la release anterior.
      - name: Smoke de producción
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/smoke-production.ts

      # `if: always()`: corre incluso si los pasos anteriores fallaron, y
      # complementa (no reemplaza) el resumen detallado que
      # `dokploy-deploy.ts` ya escribe por su cuenta en éxito y en falla -
      # esto es una red de seguridad para el caso de un crash que impida a
      # ese script escribir el suyo.
      - name: Resumen del job deploy
        if: always()
        run: |
          {
            echo "## Job \`deploy\` - resumen"
            echo ""
            echo "- **Resultado del job**: \`${{ job.status }}\`"
            echo "- **SHA capturado como vivo antes del intento**: \`${{ steps.previous-sha.outputs.sha }}\`"
            echo "- **Corrida**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Modelo legado (inactivo por defecto - ver el comentario de cabecera).
  provenance:
    name: provenance
    needs: publish
    if: inputs.publish_and_deploy
    runs-on: ubuntu-latest
    steps:
      # Tarea 9.13: SHA de Git, tags GHCR de runner/migrator, la corrida
      # del workflow y el timestamp del release quedan registrados en el
      # step summary de esta corrida. `needs: publish` (nunca
      # `needs: deploy`) a propósito: la provenance de qué se publicó no
      # SHALL quedar bloqueada detrás del clic de aprobación humana del
      # job `deploy`. Rollback SHALL seleccionar una imagen runner
      # inmutable ya construida (por SHA), nunca reconstruir desde código
      # fuente - rollback de aplicación != rollback de base de datos, la
      # seguridad del esquema sigue dependiendo de migraciones
      # retrocompatibles (tarea 9.10).
      - name: Record release provenance
        run: |
          {
            echo "## Release provenance"
            echo ""
            echo "- **Git SHA**: \`${{ github.sha }}\`"
            echo "- **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- **runner image**: \`${{ needs.publish.outputs.runner-tag }}\`"
            echo "- **migrator image**: \`${{ needs.publish.outputs.migrator-tag }}\`"
            echo "- **Dokploy deployment**: ver el resumen del job \`deploy\` de esta misma corrida (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
