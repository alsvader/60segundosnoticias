# Contrato de despliegue de producción para Dokploy (openspec/changes/
# testing-qa-performance, tarea 9.9; design.md, Decisión 13). Define el
# artefacto que Dokploy despliega en el VPS de Hostinger.
#
# Invocado de verdad desde `.github/workflows/release.yml` (job `deploy`,
# vía `scripts/dokploy-deploy.ts`) y desde `.github/workflows/rollback.yml`
# (openspec/changes/production-deployment-dokploy) - nunca a mano, y nunca
# antes de la aprobación humana del GitHub Environment `production`. Ver
# `docs/OPERATIONS.md` para el runbook operativo completo.
#
# Diferencia deliberada con `compose.prod.yaml` (que sigue siendo solo el
# artefacto local de producción-smoke / referencia self-hosted, sin
# cambio de rol): este archivo NUNCA usa `build:` - las imágenes ya
# fueron construidas, calificadas (release.yml, jobs `ci-gates` ->
# `e2e-full`/`visual`/`docker-smoke`/`lighthouse`) y publicadas en GHCR
# antes de que Dokploy vea este contrato. El VPS solo hace `pull` y
# `run`, nunca `docker build` - GitHub Actions es el único lugar donde se
# construye una imagen de producción.
#
# `${RUNNER_IMAGE}`/`${MIGRATOR_IMAGE}` SHALL resolver a un tag GHCR
# inmutable por SHA de Git (p. ej.
# ghcr.io/<owner>/60segundosnoticias:runner-<sha>), nunca al alias
# `runner-main` - el contrato de despliegue vive en el SHA, no en un
# puntero mutable (tarea 9.8/9.13). Dokploy provee estos valores junto al
# resto del entorno de runtime en el momento del despliegue - ninguno de
# ellos vive en este repositorio ni en GitHub Actions (tarea 9.7).
#
# PostgreSQL NO vive en este archivo a propósito (openspec/changes/
# production-deployment-dokploy): es un servicio de base de datos
# gestionado por Dokploy, con sus respaldos programados a S3 y su restore
# como función nativa de la plataforma. `DATABASE_URI` apunta a él. Esto
# ya era una configuración soportada por el spec `production-deployment`
# ("`DATABASE_URI` es agnóstico del proveedor de PostgreSQL": la app y el
# job de migración funcionan sin requerir un servicio `db` en este
# Compose), y es lo que el Master Spec §69.1 prefiere sobre una base
# self-hosted cuyos respaldos tendría que construir y mantener este
# repositorio. Consecuencia deliberada: la definición de la base (versión,
# volumen, calendario de respaldo) vive en Dokploy, no en git - el
# procedimiento para recrearla está en `docs/OPERATIONS.md`.

services:
  migrate:
    image: ${MIGRATOR_IMAGE:?MIGRATOR_IMAGE requerida}
    environment:
      DATABASE_URI: ${DATABASE_URI:?DATABASE_URI requerida}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requerido}
    networks:
      - dokploy-network
    # Sin `depends_on: db` - PostgreSQL ya no vive en este stack (ver el
    # encabezado). `DATABASE_URI` apunta a un servicio de base de datos
    # gestionado por Dokploy, con su propio ciclo de vida, anterior e
    # independiente al de este Compose.
    #
    # Job de un solo uso - nunca un servicio de larga duración (AC-DB-004).
    restart: "no"

  app:
    image: ${RUNNER_IMAGE:?RUNNER_IMAGE requerida}
    environment:
      DATABASE_URI: ${DATABASE_URI:?DATABASE_URI requerida}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requerido}

      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL requerida}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET requerido}

      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT requerido}
      S3_REGION: ${S3_REGION:?S3_REGION requerida}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET requerido}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID requerido}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY requerido}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL requerido}
    # Sin `ports:` a propósito - Dokploy enruta por Traefik sobre
    # `dokploy-network` hacia el puerto del contenedor (el Domain del
    # servicio ya apunta a container port 3000), no por un puerto
    # publicado en el host. Publicar `3000:3000` era además la causa de
    # un fallo real de despliegue ("port is already allocated") - EXPOSE
    # 3000 en el Dockerfile ya es suficiente para que Traefik lo alcance.
    # La app SHALL arrancar solo después de una migración exitosa (tarea
    # 9.10) - si `migrate` falla, `app` nunca arranca. El HEALTHCHECK del
    # propio container (Dockerfile, stage `runner`) se hereda
    # automáticamente.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
