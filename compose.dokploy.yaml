# Contrato de despliegue de producción para Dokploy.
#
# Dokploy lo despliega vía su propio Auto Deploy nativo sobre `push` a
# `main` - nunca desde un job de GitHub Actions. `.github/workflows/ci.yml`
# sigue siendo el gate obligatorio de PR/merge (quality/integration/e2e-pr/
# docker-build); `.github/workflows/release.yml` queda como suite de QA
# extendida opcional (workflow_dispatch), y ya no publica ni despliega nada
# por defecto. Ver `docs/OPERATIONS.md` para el runbook operativo completo.
#
# Igual que `compose.prod.yaml`: Dokploy construye la imagen `runner`/
# `migrator` desde este mismo Dockerfile en cada deploy - ya no hay
# imágenes pre-construidas en GHCR que consumir (simplificación deliberada
# para reducir minutos de CI en un proyecto de un solo mantenedor; se
# renuncia a la trazabilidad "qué se calificó == qué se despliega" vía tag
# inmutable por SHA a cambio de un pipeline más simple y barato). Diferencia
# real con `compose.prod.yaml`: sin `ports:` publicado (Traefik enruta por
# `dokploy-network`), sin servicio `db` propio, y build/runtime toman sus
# variables directamente del entorno que Dokploy ya tiene configurado para
# este servicio Compose (nunca viven en este repositorio ni en GitHub
# Actions).
#
# Trade-off aceptado: a diferencia del modelo anterior, este build no pasa
# `GIT_SHA` como build-arg (nadie en este flujo conoce el SHA exacto en
# build time - `.git` está excluido del build context vía `.dockerignore`,
# igual que en `compose.prod.yaml`), así que `/api/health` deja de reportar
# un `sha` fiable. La verificación post-deploy se reduce a "el sitio
# responde sano", no "es exactamente este commit" - ver
# `.github/workflows/rollback.yml`.
#
# PostgreSQL NO vive en este archivo a propósito: es un servicio de base de
# datos gestionado por Dokploy, con sus respaldos programados a S3 y su
# restore como función nativa de la plataforma. `DATABASE_URI` apunta a él
# (`production-deployment`: "DATABASE_URI es agnóstico del proveedor de
# PostgreSQL" - la app y el job de migración funcionan sin requerir un
# servicio `db` en este Compose). Consecuencia deliberada: la definición de
# la base (versión, volumen, calendario de respaldo) vive en Dokploy, no en
# git - el procedimiento para recrearla está en `docs/OPERATIONS.md`.

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URI: ${DATABASE_URI:?DATABASE_URI requerida}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requerido}
    networks:
      - dokploy-network
    # Sin `depends_on: db` - PostgreSQL ya no vive en este stack (ver el
    # encabezado). `DATABASE_URI` apunta a un servicio de base de datos
    # gestionado por Dokploy, con su propio ciclo de vida, anterior e
    # independiente al de este Compose.
    #
    # Job de un solo uso - nunca un servicio de larga duración (AC-DB-004).
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Únicas variables que `next build` necesita (ver Dockerfile, stage
        # `builder`): `NEXT_PUBLIC_SITE_URL` se incrusta en el bundle de
        # cliente; `DATABASE_URI`/`PAYLOAD_SECRET` los exige
        # `payload.config.ts` incluso en build time. Ninguno de los tres es
        # un secreto de runtime real en este contexto - los secretos
        # genuinos (`PREVIEW_SECRET`, `S3_*`) no se pasan como build arg.
        DATABASE_URI: ${DATABASE_URI:?DATABASE_URI requerida}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requerido}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL requerida}
    environment:
      DATABASE_URI: ${DATABASE_URI:?DATABASE_URI requerida}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET requerido}

      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL requerida}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET requerido}

      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT requerido}
      S3_REGION: ${S3_REGION:?S3_REGION requerida}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET requerido}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID requerido}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY requerido}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL requerido}
    # Sin `ports:` a propósito - Dokploy enruta por Traefik sobre
    # `dokploy-network` hacia el puerto del contenedor (el Domain del
    # servicio ya apunta a container port 3000), no por un puerto
    # publicado en el host. Publicar `3000:3000` era además la causa de
    # un fallo real de despliegue ("port is already allocated") - EXPOSE
    # 3000 en el Dockerfile ya es suficiente para que Traefik lo alcance.
    # La app SHALL arrancar solo después de una migración exitosa - si
    # `migrate` falla, `app` nunca arranca. El HEALTHCHECK del propio
    # container (Dockerfile, stage `runner`) se hereda automáticamente.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
